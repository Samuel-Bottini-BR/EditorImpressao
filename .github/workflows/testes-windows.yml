# Testes do Editor de Impressao num Windows de verdade (maquinas gratuitas do GitHub).
#
# O QUE FAZ
#   - "suite": a suite inteira (tests/test_*.py) dividida em 5 maquinas em paralelo.
#     Cada maquina roda a sua parte ARQUIVO POR ARQUIVO, como o Samuel roda no PC
#     (historico/..., PARTE -13): -p no:cacheprovider, --basetemp proprio, TEMP/TMP
#     e a pasta de dados (LOCALAPPDATA) dentro da pasta de trabalho. Quem divide e
#     roda e o .github/scripts/rodar_parte.py. Relatorio de cada parte (junit .xml,
#     texto por arquivo, resumo.txt, tempos.json) sai como "artifact".
#   - "janela": o teste_botoes.py (clica em todos os botoes) e os prints da janela
#     real, aberta na tela do Windows (nao offscreen), nos tres temas
#     (.github/scripts/fotografar_janela.py). Prints como "artifact".
#   Os arquivos pesados que ficam fora do git do programa (gabarito/ e modelos/)
#   vem do ramo "dados-de-teste" deste mesmo repositorio (ver o LEIA-ME.md de la).
#   As versoes das bibliotecas sao as da .venv do Samuel (.github/requisitos-windows.txt).
#
# QUANDO RODA
#   A cada push no ramo claude/list-server-files-gkos8v, e a mao (Actions >
#   "Testes no Windows" > Run workflow). Testa o codigo do proprio commit.
#
# SEGURO MUDAR: o numero de partes (mude "parte" e o "--de" juntos), os limites de
#   tempo, a resolucao da tela, o que o roteiro de prints fotografa.
# ARRISCADO MUDAR:
#   - pular, desligar ou marcar xfail qualquer teste para "ficar verde": proibido
#     (o objetivo e ver o mesmo resultado do PC do Samuel, nao um verde de mentira);
#   - soltar as versoes travadas (o resultado deixa de ser comparavel com o PC dele);
#   - tirar o LOCALAPPDATA/TEMP/TMP da pasta de trabalho (os testes passariam a
#     escrever na pasta do usuario do runner, e uma parte poderia ver o lixo da outra);
#   - trocar o ramo de dados por download de outro lugar (o HD do Samuel nao e
#     acessivel do GitHub, e o ramo e a unica copia publicada que ele autorizou);
#   - "fail-fast: true" (uma parte que falha cancelaria as outras e esconderia o resto).

name: Testes no Windows

# Com "ramo" preenchido (so pelo workflow_dispatch), o CODIGO DO PROGRAMA vem
# daquele ramo e a .github/ (este workflow e os scripts) continua a deste
# (.github/scripts/trocar_codigo.sh). Nada e gravado no ramo testado.
run-name: Testes no Windows (${{ inputs.ramo || github.ref_name }})

on:
  push:
    branches: [claude/list-server-files-gkos8v]
  workflow_dispatch:
    inputs:
      ramo:
        description: "Ramo (ou commit) cujo programa sera testado; vazio = este commit"
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.3"          # a mesma do PC do Samuel (.venv/pyvenv.cfg)
  PYTHONUTF8: "1"                   # acentos na saida do pytest e nos .txt
  PYTHONIOENCODING: "utf-8"

jobs:
  suite:
    name: Suite (parte ${{ matrix.parte }} de 5)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4, 5]
    steps:
      - name: Codigo do programa (este commit)
        uses: actions/checkout@v4

      - name: Trocar o codigo pelo do ramo pedido (se houver)
        shell: bash
        env:
          RAMO_PEDIDO: ${{ inputs.ramo }}     # por variavel, nunca colado no comando
        run: bash .github/scripts/trocar_codigo.sh "$RAMO_PEDIDO"

      - name: Arquivos pesados (ramo dados-de-teste)
        uses: actions/checkout@v4
        with:
          ref: dados-de-teste
          path: _dados_de_teste

      - name: Copiar gabarito/ e modelos/ para onde o codigo espera
        shell: pwsh
        run: |
          # robocopy /E junta com o que ja existe (gabarito/lista.json e o LEIA-ME
          # vem do proprio programa e nao estao no ramo de dados). Codigo < 8 = ok.
          robocopy _dados_de_teste\gabarito gabarito /E /NFL /NDL /NJH /NP
          if ($LASTEXITCODE -ge 8) { exit 1 }
          robocopy _dados_de_teste\modelos modelos /E /NFL /NDL /NJH /NP
          if ($LASTEXITCODE -ge 8) { exit 1 }
          Remove-Item -Recurse -Force _dados_de_teste
          exit 0

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: .github/requisitos-windows.txt

      - name: Bibliotecas (versoes da .venv do Samuel)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/requisitos-windows.txt
          python -m pip list

      - name: Pastas temporarias e de dados dentro da pasta de trabalho
        shell: pwsh
        run: |
          $t = Join-Path $env:GITHUB_WORKSPACE "_temp_testes"
          New-Item -ItemType Directory -Force -Path $t, "$t\tmp", "$t\localappdata", "$t\appdata" | Out-Null
          "PASTA_TEMP_DOS_TESTES=$t" >> $env:GITHUB_ENV
          "TEMP=$t\tmp" >> $env:GITHUB_ENV
          "TMP=$t\tmp" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$t\localappdata" >> $env:GITHUB_ENV
          "APPDATA=$t\appdata" >> $env:GITHUB_ENV

      - name: Rodar a parte ${{ matrix.parte }}
        run: python .github/scripts/rodar_parte.py --parte ${{ matrix.parte }} --de 5 --saida relatorio-parte-${{ matrix.parte }}

      - name: O que ficou na pasta de dados de verdade (fora do basetemp)
        # Os testes trocam o LOCALAPPDATA por uma pasta deles (tests/conftest.py).
        # Se alguma coisa escreveu na pasta "de verdade" desta maquina (a que o
        # job definiu), ela aparece aqui, com o erros.log inteiro se existir.
        if: always()
        shell: pwsh
        run: |
          $saida = "relatorio-parte-${{ matrix.parte }}"
          New-Item -ItemType Directory -Force -Path $saida | Out-Null
          $f = "$saida/dados-reais.txt"
          "testado: $env:TESTADO_RAMO $env:TESTADO_SHA" | Out-File -Encoding utf8 $f
          "pasta de dados de verdade: $env:LOCALAPPDATA" | Out-File -Encoding utf8 -Append $f
          Get-ChildItem -Recurse -Force $env:LOCALAPPDATA -ErrorAction SilentlyContinue |
            ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName } | Out-File -Encoding utf8 -Append $f
          $log = Join-Path $env:LOCALAPPDATA "EditorImpressao\erros.log"
          if (Test-Path $log) { "=== erros.log ===" | Out-File -Encoding utf8 -Append $f; Get-Content $log | Out-File -Encoding utf8 -Append $f }
          else { "erros.log: nao existe" | Out-File -Encoding utf8 -Append $f }
          Get-Content $f
          exit 0

      - name: Guardar o relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-parte-${{ matrix.parte }}
          path: relatorio-parte-${{ matrix.parte }}
          if-no-files-found: warn

  janela:
    name: Botoes e prints da janela real
    runs-on: windows-latest
    timeout-minutes: 45
    # Escrita SO neste job, e so para o passo que grava os prints no ramo
    # prints-testes (autorizado pelo Samuel em 09/10/2026). Arriscado: dar
    # "contents: write" aos outros jobs, ou no topo do arquivo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Trocar o codigo pelo do ramo pedido (se houver)
        shell: bash
        env:
          RAMO_PEDIDO: ${{ inputs.ramo }}     # por variavel, nunca colado no comando
        run: bash .github/scripts/trocar_codigo.sh "$RAMO_PEDIDO"

      - name: Arquivos pesados (ramo dados-de-teste)
        uses: actions/checkout@v4
        with:
          ref: dados-de-teste
          path: _dados_de_teste

      - name: Copiar gabarito/ e modelos/ para onde o codigo espera
        shell: pwsh
        run: |
          robocopy _dados_de_teste\gabarito gabarito /E /NFL /NDL /NJH /NP
          if ($LASTEXITCODE -ge 8) { exit 1 }
          robocopy _dados_de_teste\modelos modelos /E /NFL /NDL /NJH /NP
          if ($LASTEXITCODE -ge 8) { exit 1 }
          Remove-Item -Recurse -Force _dados_de_teste
          exit 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: .github/requisitos-windows.txt

      - name: Bibliotecas (versoes da .venv do Samuel)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/requisitos-windows.txt

      - name: Pastas temporarias e de dados dentro da pasta de trabalho
        shell: pwsh
        run: |
          $t = Join-Path $env:GITHUB_WORKSPACE "_temp_testes"
          New-Item -ItemType Directory -Force -Path $t, "$t\tmp", "$t\localappdata", "$t\appdata" | Out-Null
          "TEMP=$t\tmp" >> $env:GITHUB_ENV
          "TMP=$t\tmp" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$t\localappdata" >> $env:GITHUB_ENV
          "APPDATA=$t\appdata" >> $env:GITHUB_ENV

      - name: Tela em 1920x1080 (se o Windows do GitHub deixar)
        shell: pwsh
        continue-on-error: true
        run: |
          # Set-DisplayResolution existe no Windows Server; se falhar, o roteiro
          # de prints anota a resolucao que ficou (roteiro.txt).
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution

      - name: teste_botoes.py (clica em todos os botoes, como no PC)
        run: |
          python teste_botoes.py > teste_botoes.txt 2>&1
          $codigo = $LASTEXITCODE
          Get-Content teste_botoes.txt -Tail 60
          exit $codigo

      - name: Prints da janela real (tres temas)
        if: always()
        run: python .github/scripts/fotografar_janela.py --saida prints

      - name: Guardar prints e relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janela-prints
          path: |
            prints
            teste_botoes.txt
            saida_teste/botoes/falhas.log
          if-no-files-found: warn

      - name: Gravar os prints no ramo prints-testes
        # O QUE FAZ: copia os prints/*.png desta rodada para uma pasta nova
        # AAAA-MM-DD_HHMM_<sha7>/ (hora UTC, sha do commit testado) no ramo
        # orfao prints-testes, que so tem imagens e o LEIA-ME
        # (.github/prints-testes-LEIA-ME.md). Se o ramo nao existe, nasce aqui.
        # Corrida entre rodadas: a cada tentativa busca o ramo de novo, poe a
        # pasta por cima e tenta o push; se outra rodada empurrou antes, o push
        # e recusado e tenta de novo (ate 5 vezes). Cada rodada so ACRESCENTA
        # uma pasta, entao nao ha conflito de conteudo.
        # ARRISCADO MUDAR: empurrar para outro ramo (so este foi autorizado);
        # usar --force (apagaria os prints de outra rodada); gravar aqui texto
        # ou dado do programa (o ramo e so de imagens).
        if: always()
        shell: bash
        env:
          RAMO_PEDIDO: ${{ inputs.ramo }}
        run: |
          set -u
          shopt -s nullglob
          imagens=(prints/*.png)
          if [ ${#imagens[@]} -eq 0 ]; then echo "nenhum print para gravar"; exit 0; fi
          # pasta: data-hora UTC, sha do PROGRAMA testado e, se veio de outro
          # ramo, o nome dele (barras viram hifen)
          PASTA="$(date -u +%Y-%m-%d_%H%M)_${TESTADO_SHA::7}"
          if [ -n "$RAMO_PEDIDO" ]; then PASTA="${PASTA}_$(printf '%s' "$RAMO_PEDIDO" | tr -c 'A-Za-z0-9._-' '-')"; fi
          W="$(cygpath -u "$RUNNER_TEMP")/prints-testes"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3 4 5; do
            rm -rf "$W"; git worktree prune
            if git fetch --depth=1 origin prints-testes; then
              git worktree add --detach "$W" FETCH_HEAD
            else
              git worktree add --orphan -b "prints-testes-$tentativa" "$W"
            fi
            mkdir -p "$W/$PASTA"
            cp "${imagens[@]}" "$W/$PASTA/"
            cp .github/prints-testes-LEIA-ME.md "$W/LEIA-ME.md"
            git -C "$W" add -A
            git -C "$W" commit -q -m "Prints da janela real: $PASTA (rodada ${GITHUB_RUN_ID}, programa de ${TESTADO_RAMO})"
            if git -C "$W" push origin HEAD:refs/heads/prints-testes; then
              echo "gravado em prints-testes/$PASTA"; exit 0
            fi
            echo "push recusado (outra rodada gravou antes?), tentativa $tentativa"; sleep $((tentativa * 5))
          done
          echo "nao consegui gravar os prints no ramo prints-testes"; exit 1

  resumo:
    # Junta os relatorios das partes e da janela num texto so, no log deste job
    # (.github/scripts/resumir.py). Existe porque os "artifacts" nao baixam de
    # todo lugar; o log sempre se le. Roda mesmo se alguma parte falhou.
    name: Resumo
    needs: [suite, janela]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: _relatorios
      - name: Resumo geral
        run: python3 .github/scripts/resumir.py _relatorios
