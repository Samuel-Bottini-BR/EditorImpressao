<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="700" fill="#222">Hoje no nosso programa: corta primeiro, desentorta depois</text>
  <text x="20" y="330" font-size="22" font-weight="700" fill="#222">No ScanTailor (opção A): marca o corte, desentorta, corta uma vez só no fim</text>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <!-- LINHA 1 -->
  <g transform="translate(20,55)">
    <rect x="0" y="0" width="190" height="200" fill="#efe3c8" stroke="#999"/>
    <g stroke="#333" stroke-width="3" fill="none">
      <path d="M30,40 Q95,30 160,40"/><path d="M30,70 Q95,60 160,70"/><path d="M30,100 Q95,90 160,100"/><path d="M30,130 Q95,120 160,130"/><path d="M30,160 Q95,150 160,160"/>
    </g>
    <text x="95" y="225" font-size="16" text-anchor="middle" fill="#333">1. Página com linhas curvas</text>
  </g>
  <line x1="220" y1="155" x2="262" y2="155" stroke="#555" stroke-width="3" marker-end="url(#s)"/>
  <g transform="translate(270,55)">
    <rect x="0" y="0" width="190" height="200" fill="#efe3c8" stroke="#999" opacity="0.35"/>
    <rect x="24" y="28" width="142" height="142" fill="#efe3c8" stroke="#c00" stroke-width="3"/>
    <g stroke="#333" stroke-width="3" fill="none">
      <path d="M30,40 Q95,30 160,40"/><path d="M30,70 Q95,60 160,70"/><path d="M30,100 Q95,90 160,100"/><path d="M30,130 Q95,120 160,130"/><path d="M30,160 Q95,150 160,160"/>
    </g>
    <text x="95" y="225" font-size="16" text-anchor="middle" fill="#333">2. Corta rente (o papel vai embora)</text>
  </g>
  <line x1="470" y1="155" x2="512" y2="155" stroke="#555" stroke-width="3" marker-end="url(#s)"/>
  <g transform="translate(520,55)">
    <rect x="24" y="28" width="142" height="142" fill="#efe3c8" stroke="#c00" stroke-width="3"/>
    <g stroke="#333" stroke-width="3" fill="none">
      <line x1="4" y1="45" x2="186" y2="45"/><line x1="4" y1="75" x2="186" y2="75"/><line x1="4" y1="105" x2="186" y2="105"/><line x1="4" y1="135" x2="186" y2="135"/><line x1="4" y1="160" x2="186" y2="160"/>
    </g>
    <rect x="0" y="28" width="24" height="142" fill="#ffffff" opacity="0.85"/>
    <rect x="166" y="28" width="24" height="142" fill="#ffffff" opacity="0.85"/>
    <text x="95" y="225" font-size="16" text-anchor="middle" fill="#333">3. Desentorta: as linhas esticam</text>
  </g>
  <line x1="720" y1="155" x2="762" y2="155" stroke="#555" stroke-width="3" marker-end="url(#s)"/>
  <g transform="translate(770,55)">
    <rect x="0" y="28" width="170" height="142" fill="#efe3c8" stroke="#c00" stroke-width="3"/>
    <g stroke="#333" stroke-width="3"><line x1="0" y1="45" x2="170" y2="45"/><line x1="0" y1="75" x2="170" y2="75"/><line x1="0" y1="105" x2="170" y2="105"/><line x1="0" y1="135" x2="170" y2="135"/><line x1="0" y1="160" x2="170" y2="160"/></g>
    <text x="85" y="200" font-size="16" text-anchor="middle" fill="#c00" font-weight="700">O começo e o fim das</text>
    <text x="85" y="222" font-size="16" text-anchor="middle" fill="#c00" font-weight="700">linhas saem da página</text>
  </g>
  <!-- LINHA 2 -->
  <g transform="translate(20,350)">
    <rect x="0" y="0" width="190" height="200" fill="#efe3c8" stroke="#999"/>
    <g stroke="#333" stroke-width="3" fill="none">
      <path d="M30,40 Q95,30 160,40"/><path d="M30,70 Q95,60 160,70"/><path d="M30,100 Q95,90 160,100"/><path d="M30,130 Q95,120 160,130"/><path d="M30,160 Q95,150 160,160"/>
    </g>
    <text x="95" y="225" font-size="16" text-anchor="middle" fill="#333">1. Página com linhas curvas</text>
  </g>
  <line x1="220" y1="450" x2="262" y2="450" stroke="#555" stroke-width="3" marker-end="url(#s)"/>
  <g transform="translate(270,350)">
    <rect x="0" y="0" width="190" height="200" fill="#efe3c8" stroke="#999"/>
    <rect x="24" y="28" width="142" height="142" fill="none" stroke="#0a7" stroke-width="3" stroke-dasharray="8 6"/>
    <g stroke="#333" stroke-width="3" fill="none">
      <path d="M30,40 Q95,30 160,40"/><path d="M30,70 Q95,60 160,70"/><path d="M30,100 Q95,90 160,100"/><path d="M30,130 Q95,120 160,130"/><path d="M30,160 Q95,150 160,160"/>
    </g>
    <text x="95" y="225" font-size="16" text-anchor="middle" fill="#333">2. Só marca onde cortar</text>
  </g>
  <line x1="470" y1="450" x2="512" y2="450" stroke="#555" stroke-width="3" marker-end="url(#s)"/>
  <g transform="translate(520,350)">
    <rect x="0" y="0" width="190" height="200" fill="#efe3c8" stroke="#999"/>
    <g stroke="#333" stroke-width="3"><line x1="10" y1="45" x2="180" y2="45"/><line x1="10" y1="75" x2="180" y2="75"/><line x1="10" y1="105" x2="180" y2="105"/><line x1="10" y1="135" x2="180" y2="135"/><line x1="10" y1="160" x2="180" y2="160"/></g>
    <rect x="24" y="28" width="142" height="142" fill="none" stroke="#0a7" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="95" y="225" font-size="16" text-anchor="middle" fill="#333">3. Desentorta com o papel em volta</text>
  </g>
  <line x1="720" y1="450" x2="762" y2="450" stroke="#555" stroke-width="3" marker-end="url(#s)"/>
  <g transform="translate(770,350)">
    <rect x="0" y="20" width="170" height="160" fill="#efe3c8" stroke="#0a7" stroke-width="3"/>
    <g stroke="#333" stroke-width="3"><line x1="12" y1="45" x2="158" y2="45"/><line x1="12" y1="75" x2="158" y2="75"/><line x1="12" y1="105" x2="158" y2="105"/><line x1="12" y1="135" x2="158" y2="135"/><line x1="12" y1="160" x2="158" y2="160"/></g>
    <text x="85" y="205" font-size="16" text-anchor="middle" fill="#0a7" font-weight="700">4. Corta uma vez: as</text>
    <text x="85" y="227" font-size="16" text-anchor="middle" fill="#0a7" font-weight="700">linhas ficam inteiras</text>
  </g>
</svg>
